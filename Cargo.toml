[workspace]
resolver = "2"
members = [
    "crates/lapacho-core",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Leonardo Fishman", "Quebracho Digital"]
repository = "https://github.com/leofishman/lapacho"
rust-version = "1.85"

[workspace.dependencies]
lapacho-core = { path = "crates/lapacho-core" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1.10"
uuid = { version = "1.11", features = ["v4"] }
rusqlite = { version = "0.32", features = ["bundled"] }
aes-gcm = { version = "0.10", features = ["zeroize"] }
getrandom = "0.2"
base64 = "0.22"
zeroize = "1"
region = "3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
