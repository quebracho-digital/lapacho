<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Halo celeste argentino, sutil -->
  <circle cx="256" cy="256" r="240" fill="none" stroke="#74ACDF" stroke-width="4" opacity="0.4"/>
  <circle cx="256" cy="256" r="224" fill="none" stroke="#74ACDF" stroke-width="2" opacity="0.25"/>
  
  <!-- Hexágono base -->
  <path d="M256 40 L440 148 L440 364 L256 472 L72 364 L72 148 Z" 
        fill="#1B4332" stroke="#52B788" stroke-width="8" stroke-linejoin="round"/>
  
  <!-- Hoja de lapacho como circuito -->
  <g stroke="#52B788" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Nervio central -->
    <path d="M256 140 L256 380" />
    <!-- Lóbulos izquierdos -->
    <path d="M256 200 L160 160 L120 220 L160 280 L200 240" />
    <path d="M256 280 L160 260 L120 320 L180 360 L220 320" />
    <!-- Lóbulos derechos -->
    <path d="M256 200 L352 160 L392 220 L352 280 L312 240" />
    <path d="M256 280 L352 260 L392 320 L332 360 L292 320" />
    <!-- Tallo -->
    <path d="M256 380 L256 420" />
  </g>
  
  <!-- Nodos dorados (puntos de unión) -->
  <circle cx="256" cy="200" r="10" fill="#D4A373"/>
  <circle cx="256" cy="280" r="10" fill="#D4A373"/>
  <circle cx="160" cy="160" r="8" fill="#D4A373"/>
  <circle cx="352" cy="160" r="8" fill="#D4A373"/>
  <circle cx="120" cy="220" r="8" fill="#D4A373"/>
  <circle cx="392" cy="220" r="8" fill="#D4A373"/>
  <circle cx="256" cy="420" r="12" fill="#D4A373"/>
</svg>
