<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Fondo circular blanco/rosado pastel solido ultra brillante para maximo contraste en panales oscuros -->
  <circle cx="256" cy="256" r="240" fill="#FFFFFF" stroke="#F472B6" stroke-width="16"/>
  
  <!-- Sombra interior sutil de definicion -->
  <circle cx="256" cy="256" r="228" fill="#FFF1F2"/>

  <!-- Icono de Portapapeles/Hoja central en Rosa Lapacho inteso (#DB2777 / #BE185D) -->
  <g fill="none" stroke="#DB2777" stroke-width="28" stroke-linecap="round" stroke-linejoin="round">
    <!-- Cuerpo del portapapeles/hoja estilizada -->
    <rect x="120" y="110" width="272" height="330" rx="36" fill="#FCE7F3" stroke="#DB2777" stroke-width="24"/>
    
    <!-- Clip superior -->
    <path d="M190 110 V80 C190 65 202 54 216 54 H296 C310 54 322 65 322 80 V110 Z" fill="#F472B6" stroke="#BE185D" stroke-width="20"/>
    
    <!-- Flor/Hoja de Lapacho simplificada de alto contraste dentro del portapapeles -->
    <path d="M256 190 V370" stroke="#BE185D" stroke-width="24"/>
    <path d="M256 240 L180 200 L160 260 L256 310" fill="#F472B6" stroke="#BE185D" stroke-width="18"/>
    <path d="M256 240 L332 200 L352 260 L256 310" fill="#F472B6" stroke="#BE185D" stroke-width="18"/>
  </g>
  
  <!-- Nodos amarillos brillantes centelleantes -->
  <circle cx="256" cy="240" r="18" fill="#FACC15"/>
  <circle cx="256" cy="310" r="18" fill="#FACC15"/>
  <circle cx="180" cy="200" r="14" fill="#FACC15"/>
  <circle cx="332" cy="200" r="14" fill="#FACC15"/>
</svg>
