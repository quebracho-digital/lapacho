[package]
name = "lapacho-desktop"
description = "Lapacho — secure clipboard manager (desktop backend)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
arboard = "3"
lapacho-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# OS keyring for the encryption key. Linux: persistent D-Bus Secret Service
# (GNOME Keyring / KWallet); macOS: Keychain; Windows: Credential Manager.
keyring = { version = "3", features = [
    "apple-native",
    "windows-native",
    "sync-secret-service",
    "crypto-rust",
] }
