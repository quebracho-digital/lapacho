[package]
name = "lapacho-desktop"
description = "Lapacho — secure clipboard manager (desktop backend)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
# Lets the image-sanitization tests build a PNG that *carries* a tEXt metadata
# chunk, to prove our re-encode strips it. Same major as `image`'s `png` dep.
png = "0.17"

[dependencies]
# `tray-icon`: native system-tray indicator + menu (the fluid recent-clips list).
tauri = { version = "2", features = ["tray-icon"] }
# Global shortcut (Ctrl+Shift+V) to toggle the window. Driven from Rust only,
# so it needs no webview capability entry.
tauri-plugin-global-shortcut = "2"
arboard = "3"
# Image clipboard support: PNG encode/decode + tray thumbnail resize.
image = { version = "0.25", default-features = false, features = ["png"] }
base64 = { workspace = true }
uuid = { workspace = true }
# `mlock`: pin the encryption key into RAM so it never reaches swap.
lapacho-core = { workspace = true, features = ["mlock"] }
serde = { workspace = true }
serde_json = { workspace = true }

# Linux-only: disable core dumps so a crash can't spill secrets to a core file.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
# OS keyring for the encryption key. Linux: persistent D-Bus Secret Service
# (GNOME Keyring / KWallet); macOS: Keychain; Windows: Credential Manager.
keyring = { version = "3", features = [
    "apple-native",
    "windows-native",
    "sync-secret-service",
    "crypto-rust",
] }
