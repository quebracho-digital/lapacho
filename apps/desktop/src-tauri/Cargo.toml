[package]
name = "lapacho-desktop"
description = "Lapacho — secure clipboard manager (desktop backend)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
# Lets the image-sanitization tests build a PNG that *carries* a tEXt metadata
# chunk, to prove our re-encode strips it. Same major as `image`'s `png` dep.
png = "0.17"

[features]
# Embed `frontendDist` (custom asset protocol) instead of loading `devUrl`.
# Required for installable/release binaries — without it the webview tries
# http://localhost:1420 and shows "Connection refused" when trunk isn't running.
# `cargo tauri dev` typically disables this so the live trunk server is used.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
# `tray-icon`: native system-tray indicator + menu (the fluid recent-clips list).
tauri = { version = "2", features = ["tray-icon"] }
# Global shortcut (Ctrl+Shift+Alt+L, Lapacho-exclusive) to toggle the window.
# Driven from Rust only, so it needs no webview capability entry.
tauri-plugin-global-shortcut = "2"
arboard = "3"
clipboard-master = "4"
# Image clipboard support: PNG encode/decode + tray thumbnail resize.
image = { version = "0.25", default-features = false, features = ["png"] }
base64 = { workspace = true }
uuid = { workspace = true }
# `mlock`: pin the encryption key into RAM so it never reaches swap.
lapacho-core = { workspace = true, features = ["mlock"] }
serde = { workspace = true }
serde_json = { workspace = true }
# Zeroize raw_content when items leave the volatile tray buffer (T8).
zeroize = { workspace = true }

# Linux-only: disable core dumps so a crash can't spill secrets to a core file.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
# OS keyring for the encryption key. Linux: persistent D-Bus Secret Service
# (GNOME Keyring / KWallet); macOS: Keychain; Windows: Credential Manager.
keyring = { version = "3", features = [
    "apple-native",
    "windows-native",
    "sync-secret-service",
    "crypto-rust",
] }
