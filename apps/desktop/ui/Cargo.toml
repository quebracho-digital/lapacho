[package]
name = "lapacho-ui"
version = "0.1.0"
edition = "2021"
description = "Lapacho desktop frontend (Leptos/WASM)"
license = "MIT OR Apache-2.0"
publish = false

# Standalone (excluded from the workspace): Trunk builds this for wasm32. It
# deliberately does NOT depend on `lapacho-core` (that would drag rusqlite/C
# into WASM); the UI mirrors the safe projection types instead.

[dependencies]
leptos = { version = "0.7", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
