[build]
target = "index.html"
dist = "dist"
# Relative asset URLs so the Tauri custom protocol (release) can load the
# WASM/JS. Absolute `/lapacho-ui-….js` paths break in the webview and leave a
# black empty window (body CSS only, Leptos never mounts).
public_url = "./"

[serve]
addresses = ["127.0.0.1"]
port = 1420
# Tauri controls the lifecycle; don't auto-open a browser.
open = false
