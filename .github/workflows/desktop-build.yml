# Builds the desktop app (Tauri + Leptos/WASM) on Linux, Windows and macOS and
# keeps the installers as workflow artifacts; on a `v*` tag it also attaches
# them to that tag's release, which the Android workflow (or release.sh)
# creates. Unsigned: macOS asks for right-click → Open, Windows shows
# SmartScreen.
name: Desktop build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev libdbus-1-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk

      # bundle.active is off in tauri.conf.json: install.sh ships the bare
      # binary on Linux. Here the installers are the point.
      - name: Build
        working-directory: apps/desktop/src-tauri
        run: npx --yes @tauri-apps/cli@2 build --config '{"bundle":{"active":true}}'

      # After the build: generate_context! embeds ui/dist, which trunk makes.
      - name: Tests
        run: cargo test -p lapacho-core -p lapacho-desktop

      - uses: actions/upload-artifact@v4
        with:
          name: lapacho-desktop-${{ runner.os }}
          if-no-files-found: error
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
            target/release/bundle/dmg/*.dmg

      - name: Attach to the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: target/release/bundle
        run: |
          # The release is created elsewhere and may not exist yet: wait up to 30 min.
          for _ in $(seq 60); do gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 && break; sleep 30; done
          # Each OS builds only its own formats: the other patterns match nothing.
          shopt -s nullglob
          files=(deb/*.deb rpm/*.rpm appimage/*.AppImage msi/*.msi nsis/*.exe dmg/*.dmg)
          for f in "${files[@]}"; do
            (cd "$(dirname "$f")" && shasum -a 256 "$(basename "$f")" > "$(basename "$f").sha256")
          done
          gh release upload "$GITHUB_REF_NAME" "${files[@]}" "${files[@]/%/.sha256}" --clobber
