# Builds the desktop app (Tauri + Leptos/WASM) on Linux, Windows and macOS and
# keeps the installers as workflow artifacts. Not attached to releases yet:
# the app has only ever been built on Linux, and this is how the other two
# get there. Unsigned: macOS asks for right-click → Open, Windows shows
# SmartScreen.
name: Desktop build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev libdbus-1-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk

      - name: Tests
        run: cargo test -p lapacho-core -p lapacho-desktop

      # bundle.active is off in tauri.conf.json: install.sh ships the bare
      # binary on Linux. Here the installers are the point.
      - name: Build
        working-directory: apps/desktop/src-tauri
        run: npx --yes @tauri-apps/cli@2 build --config '{"bundle":{"active":true}}'

      - uses: actions/upload-artifact@v4
        with:
          name: lapacho-desktop-${{ runner.os }}
          if-no-files-found: error
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
            target/release/bundle/dmg/*.dmg
