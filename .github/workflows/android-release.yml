# Builds the Android APK and publishes it as the GitHub release of a pushed
# `v*` tag. A tag already released from minisforum (release.sh) is left alone.
# Run by hand (workflow_dispatch), it only builds and keeps the APK as a
# workflow artifact: a way to check the pipeline without publishing.
#
# The APK is signed with the same debug key as the minisforum builds (secret
# ANDROID_DEBUG_KEYSTORE, base64). A different key would make Android refuse
# the update, and reinstalling wipes the history and the learned words.
name: Android release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.check.outputs.released }}
    steps:
      - id: check
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ] && gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice::$GITHUB_REF_NAME is already released"
            echo released=true >> "$GITHUB_OUTPUT"
          fi

  apk:
    needs: gate
    if: needs.gate.outputs.released != 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile/android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: NDK
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" >/dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_DEBUG_KEYSTORE }}
        run: |
          [ -n "$KEYSTORE" ] || { echo "::error::secret ANDROID_DEBUG_KEYSTORE is not set"; exit 1; }
          mkdir -p ~/.android
          echo "$KEYSTORE" | base64 -d > ~/.android/debug.keystore

      - name: Build and test
        run: gradle --no-daemon :app:assembleDebug :app:testDebugUnitTest

      - name: Package
        run: |
          version="$(sed -n 's/.*versionName = "\(.*\)"/\1/p' app/build.gradle.kts)"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match versionName $version"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/out"
          cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/out/lapacho-$version.apk"
          for dict in dictionaries/*.txt; do
            case "$(basename "$dict")" in NOTICE-*) continue ;; esac
            cp "$dict" "$RUNNER_TEMP/out/lapacho-dict-$(basename "$dict" .txt)-$(sha256sum "$dict" | cut -c1-8).dict"
          done
          cd "$RUNNER_TEMP/out" && for f in *; do sha256sum "$f" > "$f.sha256"; done
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - if: github.ref_type == 'tag'
        run: gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP"/out/* --title "Lapacho $VERSION" --generate-notes

      - if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: lapacho-${{ env.VERSION }}
          path: ${{ runner.temp }}/out
