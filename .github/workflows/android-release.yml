# Builds and tests the Android APK on every pull request and push to main
# that touches it, keeping the APK as a workflow artifact. On a pushed `v*`
# tag it also publishes it as that tag's GitHub release; a tag already
# released from minisforum (release.sh) is left alone. Path filters don't
# apply to tags: a tag always builds.
#
# The APK is signed with the same debug key as the minisforum builds (secret
# ANDROID_DEBUG_KEYSTORE, base64). A different key would make Android refuse
# the update, and reinstalling wipes the history and the learned words.
name: Android release

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: &paths
      - "apps/mobile/**"
      - "crates/**"
      - "Cargo.*"
      - ".github/workflows/android-release.yml"
  pull_request:
    paths: *paths
  workflow_dispatch:

# A newer push to the same branch or PR makes the running check moot.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

permissions:
  contents: write

env:
  GH_TOKEN: ${{ github.token }}
  # Also read by cargo-ndk; the runner's own points at a different NDK.
  ANDROID_NDK_ROOT: /usr/local/lib/android/sdk/ndk/27.2.12479018

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.check.outputs.released }}
    steps:
      - id: check
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ] && gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice::$GITHUB_REF_NAME is already released"
            echo released=true >> "$GITHUB_OUTPUT"
          fi

  apk:
    needs: gate
    if: needs.gate.outputs.released != 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile/android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: NDK
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" >/dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_DEBUG_KEYSTORE }}
        run: |
          [ -n "$KEYSTORE" ] || { echo "::error::secret ANDROID_DEBUG_KEYSTORE is not set"; exit 1; }
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/debug.keystore"
          echo "LAPACHO_DEBUG_KEYSTORE=$RUNNER_TEMP/debug.keystore" >> "$GITHUB_ENV"
          # Public: which key the secret holds, to tell a wrong secret from a wrong path.
          keytool -list -v -keystore "$RUNNER_TEMP/debug.keystore" -storepass android | grep -m1 SHA256

      - name: Build and test
        run: gradle --no-daemon :app:assembleRelease :app:testReleaseUnitTest

      # The certificate every published APK carries. A mismatch means an APK
      # that would not install over the previous ones: stop before publishing.
      - name: Check signing certificate
        run: |
          aapt="$(ls "$ANDROID_SDK_ROOT"/build-tools/*/aapt | sort -V | tail -1)"
          if "$aapt" dump badging app/build/outputs/apk/release/app-release.apk | grep -q application-debuggable; then
            echo "::error::APK is debuggable"; exit 1
          fi
          apksigner="$(ls "$ANDROID_SDK_ROOT"/build-tools/*/apksigner | sort -V | tail -1)"
          got="$("$apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk | sed -n 's/.*certificate SHA-256 digest: //p')"
          want=beeb0d4c61e5b8d94f717ce9bf78eeb273af41c8c6b06dbeb44de80d6309d266
          [ "$got" = "$want" ] || { echo "::error::APK signed with $got, expected $want"; exit 1; }

      - name: Package
        run: |
          version="$(sed -n 's/.*versionName = "\(.*\)"/\1/p' app/build.gradle.kts)"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match versionName $version"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/out"
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/out/lapacho-$version.apk"
          for dict in dictionaries/*.txt; do
            case "$(basename "$dict")" in NOTICE-*) continue ;; esac
            cp "$dict" "$RUNNER_TEMP/out/lapacho-dict-$(basename "$dict" .txt)-$(sha256sum "$dict" | cut -c1-8).dict"
          done
          cd "$RUNNER_TEMP/out" && for f in *; do sha256sum "$f" > "$f.sha256"; done
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - if: github.ref_type == 'tag'
        run: gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP"/out/* --title "Lapacho $VERSION" --generate-notes

      - if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: lapacho-${{ env.VERSION }}
          path: ${{ runner.temp }}/out
          retention-days: 14
